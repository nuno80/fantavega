name: Database schema and migration audit

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'database/**'
      - 'scripts/verify-database-schema.py'
      - '.github/workflows/database-audit.yml'

jobs:
  database-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify schema, constraints, triggers, and migration compatibility
        run: python3 scripts/verify-database-schema.py
