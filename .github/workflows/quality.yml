name: Application quality gates

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint --max-warnings 0
      - name: TypeScript
        run: pnpm type-check
      - name: Database deployment migration paths
        run: pnpm exec vitest run tests/db/migration-path.test.ts
      - name: Tests
        run: pnpm test:run
      - name: Database schema and migrations
        run: python3 scripts/verify-database-schema.py
      # PR 47-specific gate: keep the real SQLite settlement invariant check on pull requests.
      - name: Real SQLite settlement invariants
        run: python3 scripts/test-settlement-real-db.py
      - name: Production build
        if: github.event_name == 'push'
        env:
          NODE_ENV: production
          # Decodes to the non-routable test frontend identifier "clerk.accounts.dev$".
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuYWNjb3VudHMuZGV2JA==
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          TURSO_DATABASE_URL: libsql://ci.invalid
          TURSO_AUTH_TOKEN: ci-placeholder
        run: pnpm build
