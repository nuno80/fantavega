name: Application quality gates

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm type-check
      - name: ESLint
        run: pnpm exec eslint src socket-server.ts --ext .ts,.tsx
      - name: Tests
        run: pnpm test:run
      - name: Database schema and migrations
        run: python3 scripts/verify-database-schema.py
      - name: Production build
        run: pnpm build
